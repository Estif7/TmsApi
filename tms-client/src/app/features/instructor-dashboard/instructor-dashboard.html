<div class="dashboard-container">
  <!-- Analytics Visualizer -->
  <section class="analytics-section">
    <tms-analytics-chart [data]="store.entities()"></tms-analytics-chart>
  </section>

  <!-- Notification Banner for Server Errors -->
  <div *ngIf="store.error()" class="error-banner">
    {{ store.error() }}
  </div>

  <!-- Main Roster Control Section -->
  <section class="roster-section">
    <tms-course-roster></tms-course-roster>
  </section>
</div>
