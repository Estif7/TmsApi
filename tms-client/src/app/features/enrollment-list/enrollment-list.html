<div class="p-6 max-w-7xl mx-auto space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-white">Enrollment Management</h1>
      <p class="text-slate-400 text-sm">
        Pending approvals: 
        <span class="text-amber-400 font-semibold">{{ store.pendingCount() }}</span>
      </p>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
    <table mat-table [dataSource]="dataSource" matSort class="w-full">

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let element"> #{{ element.id }} </td>
      </ng-container>

      <!-- Student Column -->
      <ng-container matColumnDef="studentName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Student </th>
        <td mat-cell *matCellDef="let element"> {{ element.studentName }} </td>
      </ng-container>

      <!-- Course Column -->
      <ng-container matColumnDef="courseName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Course </th>
        <td mat-cell *matCellDef="let element"> {{ element.courseName }} </td>
      </ng-container>

      <!-- Enrolled At Column -->
      <ng-container matColumnDef="enrolledAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Enrolled At </th>
        <td mat-cell *matCellDef="let element"> {{ element.enrolledAt | date:'mediumDate' }} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let element">
          <span
            class="px-2.5 py-1 rounded-full text-xs font-semibold"
            [ngClass]="{
              'bg-amber-500/10 text-amber-400 border border-amber-500/20': element.status === 'Pending',
              'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20': element.status === 'Approved',
              'bg-rose-500/10 text-rose-400 border border-rose-500/20': element.status === 'Rejected'
            }"
          >
            {{ element.status }}
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button
            *ngIf="element.status === 'Pending'"
            mat-flat-button
            color="primary"
            (click)="approve(element.id)"
          >
            Approve
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
