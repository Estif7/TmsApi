<h1>Course Detail</h1>
<p>Course ID: {{ id() }}</p>

@if (course(); as c) {
  <div class="course-info">
    <h2>{{ c.title }}</h2>
    <!-- <p>{{ c.description }}</p> -->

    <button (click)="onDelete()" [disabled]="isDeleting()">
      {{ isDeleting() ? 'Deleting...' : 'Delete Course' }}
    </button>
  </div>
} @else if (isDeleting()) {
  <p><em>Deleting course and navigating back...</em></p>
} @else {
  <p><em>Loading course details...</em></p>
}

<br />
<a routerLink="/">Back to Dashboard</a>
