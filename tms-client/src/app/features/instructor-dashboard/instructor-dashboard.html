<section class="mt-8">
  <h2 class="text-xl font-bold text-white mb-4">Performance Overview</h2>

  @defer (on viewport) {
    <tms-analytics-chart [data]="store.entities()" />
  } @placeholder (minimum 500ms) {
    <div class="p-6 bg-slate-900/50 border border-slate-800 rounded-xl animate-pulse text-slate-400">
      Scroll to load analytics chart...
    </div>
  } @loading {
    <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl text-indigo-400">
      Loading chart bundle...
    </div>
  } @error {
    <div class="p-6 bg-red-950/30 border border-red-800 rounded-xl text-red-400">
      Failed to load analytics module.
    </div>
  }
</section>
