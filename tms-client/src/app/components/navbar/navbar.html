<nav class="navbar" *ngIf="auth.currentUser()">
  <div class="brand">
    <a routerLink="/student-dashboard"><strong>TMS</strong> Portal</a>
  </div>

  <nav class="tms-navbar" *ngIf="showNavbar()">
    <div class="nav-brand">
      <a routerLink="/dashboard">
        <span class="logo-accent">TMS</span> Portal
      </a>
    </div>

    <div class="nav-user" *ngIf="authService.currentUser() as user">
      <div class="user-details">
        <span class="user-name">{{ user.displayName }}</span>
        <span class="user-role badge" [ngClass]="user.role.toLowerCase()">
          {{ user.role }}
        </span>
      </div>
      <button type="button" class="btn-logout" (click)="onLogout()">
        Logout
      </button>
    </div>
  </nav>

  <div class="nav-links">
    <a 
      *ngIf="auth.hasRole('Student')" 
      routerLink="/student-dashboard" 
      routerLinkActive="active">
      Student Dashboard
    </a>
    <a 
      *ngIf="auth.hasRole('Instructor')" 
      routerLink="/dashboard" 
      routerLinkActive="active">
      Instructor Dashboard
    </a>
    <a 
      *ngIf="auth.hasRole('Admin')" 
      routerLink="/admin/courses" 
      routerLinkActive="active">
      Admin Panel
    </a>
  </div>

  <div class="user-profile">
    <div class="user-info">
      <span class="username">{{ auth.currentUser()?.displayName }}</span>
      <span class="role-badge">{{ auth.currentUser()?.role }}</span>
    </div>
    <button (click)="logout()" class="btn-logout">Logout</button>
  </div>
</nav>
